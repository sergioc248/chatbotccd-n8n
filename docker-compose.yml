services:
  app:
    build: .
    image: tunavegante-ccd:latest
    container_name: tunavegante-ccd
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:8000"
    env_file:
      - .env
    environment:
      N8N_TIMEOUT_SECONDS: ${N8N_TIMEOUT_SECONDS:-60}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
